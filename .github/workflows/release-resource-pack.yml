name: Release Resource Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip exists
        run: |
          ls -lh
          test -f tron_resource_pack.zip || (echo "ERROR: tron_resource_pack.zip missing!" && exit 1)

      - name: Calculate SHA-1
        id: hash
        run: |
          SHA1=$(sha1sum tron_resource_pack.zip | cut -d' ' -f1)
          echo "SHA1=$SHA1" >> $GITHUB_ENV
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "SHA-1 = $SHA1"

      - name: Create Release with gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="pack-${{ github.run_number }}"
          
          # Create the release with the SHA-1 in the body
          gh release create "$TAG" \
            --title "Resource Pack ${{ github.run_number }}" \
            --notes "$(